name: Android CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update the Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's default `sdkmanager tools` install: the `tools`
          # package was removed from the SDK and its absence fails the step.
          packages: ""

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: edgepro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug APK to Release (stable link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: EdgePro debug (latest)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Auto-built **debug** APK from CI (branch ${{ github.ref_name }}, commit ${{ github.sha }}).

            - Unsigned for Play Store; debug build for sideloading/testing only.
            - Install: `adb install app-debug.apk`
            - This release moves to the latest build each push; do not treat as a stable version.
          files: app/build/outputs/apk/debug/*.apk
